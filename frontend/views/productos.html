<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cotizaciones - Productos</title>
    <!-- Tailwind CSS CDN como fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet" onerror="this.onerror=null;">
</head>
<body class="bg-gray-100">
    <!-- Navbar (similar a otros) -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-primary-600">CRM Cotizaciones</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/cotizaciones.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Cotizaciones
                        </a>
                        <a href="/clientes.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Clientes
                        </a>
                        <a href="/productos.html" class="border-primary-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Productos
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="usuarioNombre" class="text-sm text-gray-700 mr-4"></span>
                    <button onclick="authAPI.logout()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Productos / Servicios</h2>
            <button onclick="abrirModalNuevoProducto()" class="btn-primary">
                Nuevo Producto
            </button>
        </div>

        <!-- Buscador -->
        <div class="bg-white shadow rounded-lg p-4 mb-6">
            <input type="text" id="buscarProducto" class="input-field" placeholder="Buscar productos..." onkeyup="cargarProductos()">
        </div>

        <!-- Tabla de productos -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="table-header">Nombre</th>
                        <th class="table-header">Descripción</th>
                        <th class="table-header">Precio Unitario</th>
                        <th class="table-header">Unidad</th>
                        <th class="table-header">Categoría</th>
                        <th class="table-header">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos" class="bg-white divide-y divide-gray-200">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Nuevo Producto -->
    <div id="modalNuevoProducto" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Nuevo Producto</h3>
                <form id="formNuevoProducto" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre *</label>
                            <input type="text" name="nombre" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Precio Unitario *</label>
                            <input type="number" step="0.01" name="precio_unitario" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Unidad</label>
                            <input type="text" name="unidad" value="PZA" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Categoría</label>
                            <input type="text" name="categoria" class="input-field">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                            <textarea name="descripcion" class="input-field" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="cerrarModalProducto()" class="btn-secondary">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
        }

        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        document.getElementById('usuarioNombre').textContent = usuario.nombre || 'Usuario';

        async function cargarProductos() {
            try {
                const buscar = document.getElementById('buscarProducto').value;
                const params = buscar ? { buscar, activo: 'true' } : { activo: 'true' };
                const datos = await productosAPI.obtenerTodos(params);
                const tbody = document.getElementById('tablaProductos');

                tbody.innerHTML = datos.productos.map(p => `
                    <tr>
                        <td class="table-cell font-medium">${p.nombre}</td>
                        <td class="table-cell">${p.descripcion || '-'}</td>
                        <td class="table-cell">${utils.formatearMoneda(p.precio_unitario)}</td>
                        <td class="table-cell">${p.unidad}</td>
                        <td class="table-cell">${p.categoria || '-'}</td>
                        <td class="table-cell">
                            ${(usuario.rol === 'ADMIN' || usuario.rol === 'VENTAS') ? `
                                <button onclick="editarProducto(${p.id})" class="text-blue-600 hover:text-blue-800 mr-2">Editar</button>
                            ` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error cargando productos:', error);
                utils.mostrarError('Error al cargar productos');
            }
        }

        function abrirModalNuevoProducto() {
            if (usuario.rol === 'LECTURA') {
                utils.mostrarError('No tienes permisos para crear productos');
                return;
            }
            // Restaurar título del modal
            document.querySelector('#modalNuevoProducto h3').textContent = 'Nuevo Producto';
            document.getElementById('formNuevoProducto').reset();
            document.getElementById('modalNuevoProducto').classList.remove('hidden');
        }

        function cerrarModalProducto() {
            document.getElementById('modalNuevoProducto').classList.add('hidden');
        }

        document.getElementById('formNuevoProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const producto = Object.fromEntries(formData);
            producto.precio_unitario = parseFloat(producto.precio_unitario);

            try {
                await productosAPI.crear(producto);
                utils.mostrarExito('Producto creado exitosamente');
                cerrarModalProducto();
                cargarProductos();
            } catch (error) {
                utils.mostrarError(error.message);
            }
        });

        async function editarProducto(id) {
            try {
                const datos = await productosAPI.obtenerPorId(id);
                const producto = datos.producto;
                
                // Llenar el formulario con los datos del producto
                document.getElementById('formNuevoProducto').querySelector('[name="nombre"]').value = producto.nombre || '';
                document.getElementById('formNuevoProducto').querySelector('[name="descripcion"]').value = producto.descripcion || '';
                document.getElementById('formNuevoProducto').querySelector('[name="precio_unitario"]').value = producto.precio_unitario || '';
                document.getElementById('formNuevoProducto').querySelector('[name="unidad"]').value = producto.unidad || '';
                document.getElementById('formNuevoProducto').querySelector('[name="categoria"]').value = producto.categoria || '';
                
                // Cambiar el título del modal
                document.querySelector('#modalNuevoProducto h3').textContent = 'Editar Producto';
                
                // Modificar el submit para actualizar
                const form = document.getElementById('formNuevoProducto');
                const oldSubmit = form.onsubmit;
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const productoData = Object.fromEntries(formData);
                    productoData.precio_unitario = parseFloat(productoData.precio_unitario);
                    
                    try {
                        await productosAPI.actualizar(id, productoData);
                        utils.mostrarExito('Producto actualizado exitosamente');
                        cerrarModalProducto();
                        cargarProductos();
                        form.onsubmit = oldSubmit; // Restaurar el handler original
                    } catch (error) {
                        utils.mostrarError(error.message);
                    }
                };
                
                abrirModalNuevoProducto();
            } catch (error) {
                utils.mostrarError('Error al cargar datos del producto: ' + error.message);
            }
        }

        cargarProductos();
    </script>
</body>
</html>
