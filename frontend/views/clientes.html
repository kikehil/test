<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cotizaciones - Clientes</title>
    <!-- Tailwind CSS CDN como fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet" onerror="this.onerror=null;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 via-blue-50 to-purple-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-xl border-b-2 border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-primary-600">CRM Cotizaciones</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/cotizaciones.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Cotizaciones
                        </a>
                        <a href="/clientes.html" class="border-primary-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Clientes
                        </a>
                        <a href="/productos.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Productos
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="usuarioNombre" class="text-sm text-gray-700 mr-4"></span>
                    <button onclick="authAPI.logout()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-green-500 to-teal-500 rounded-lg p-3">
                    <i class="fas fa-users text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold bg-gradient-to-r from-green-600 to-teal-600 bg-clip-text text-transparent">Clientes</h2>
            </div>
            <button onclick="abrirModalNuevoCliente()" class="bg-gradient-to-r from-green-600 to-teal-600 text-white px-6 py-3 rounded-lg hover:from-green-700 hover:to-teal-700 transition-all duration-200 shadow-lg hover:shadow-xl font-semibold transform hover:-translate-y-0.5">
                <i class="fas fa-user-plus mr-2"></i>Nuevo Cliente
            </button>
        </div>

        <!-- Buscador -->
        <div class="card bg-white mb-6">
            <input type="text" id="buscarCliente" class="input-field" placeholder="Buscar por nombre, email o RFC..." onkeyup="cargarClientes()">
        </div>

        <!-- Tabla de clientes -->
        <div class="card bg-white overflow-hidden p-0">
            <table class="min-w-full">
                <thead>
                    <tr>
                        <th class="table-header">Nombre / Razón Social</th>
                        <th class="table-header">RFC</th>
                        <th class="table-header">Email</th>
                        <th class="table-header">Teléfono</th>
                        <th class="table-header">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes" class="bg-white divide-y divide-gray-200">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Nuevo Cliente -->
    <div id="modalNuevoCliente" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Nuevo Cliente</h3>
                <form id="formNuevoCliente" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre / Razón Social *</label>
                            <input type="text" name="nombre_razon_social" required class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">RFC</label>
                            <input type="text" name="rfc" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                            <input type="email" name="email" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                            <input type="tel" name="telefono" class="input-field">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
                            <textarea name="direccion" class="input-field" rows="2"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Giro</label>
                            <input type="text" name="giro" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Contacto Principal</label>
                            <input type="text" name="contacto_principal" class="input-field">
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="cerrarModalCliente()" class="btn-secondary">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
        }

        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        document.getElementById('usuarioNombre').textContent = usuario.nombre || 'Usuario';

        async function cargarClientes() {
            try {
                const buscar = document.getElementById('buscarCliente').value;
                const params = buscar ? { buscar } : {};
                const datos = await clientesAPI.obtenerTodos(params);
                const tbody = document.getElementById('tablaClientes');

                tbody.innerHTML = datos.clientes.map(c => `
                    <tr>
                        <td class="table-cell font-medium">${c.nombre_razon_social}</td>
                        <td class="table-cell">${c.rfc || '-'}</td>
                        <td class="table-cell">${c.email || '-'}</td>
                        <td class="table-cell">${c.telefono || '-'}</td>
                        <td class="table-cell">
                            <div class="flex space-x-2">
                                <button onclick="verCliente(${c.id})" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg hover:bg-blue-200 transition-colors font-medium">
                                    <i class="fas fa-eye mr-1"></i>Ver
                                </button>
                                ${(usuario.rol === 'ADMIN' || usuario.rol === 'VENTAS') ? `
                                    <button onclick="editarCliente(${c.id})" class="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg hover:bg-purple-200 transition-colors font-medium">
                                        <i class="fas fa-edit mr-1"></i>Editar
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error cargando clientes:', error);
                utils.mostrarError('Error al cargar clientes');
            }
        }

        function abrirModalNuevoCliente() {
            if (usuario.rol === 'LECTURA') {
                utils.mostrarError('No tienes permisos para crear clientes');
                return;
            }
            // Limpiar ID de edición
            clienteEditandoId = null;
            // Restaurar título del modal
            document.querySelector('#modalNuevoCliente h3').textContent = 'Nuevo Cliente';
            document.getElementById('formNuevoCliente').reset();
            document.getElementById('modalNuevoCliente').classList.remove('hidden');
        }

        function cerrarModalCliente() {
            clienteEditandoId = null;
            document.getElementById('modalNuevoCliente').classList.add('hidden');
        }

        document.getElementById('formNuevoCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const cliente = Object.fromEntries(formData);

            try {
                if (clienteEditandoId) {
                    // Actualizar cliente existente
                    await clientesAPI.actualizar(clienteEditandoId, cliente);
                    utils.mostrarExito('Cliente actualizado exitosamente');
                    clienteEditandoId = null;
                } else {
                    // Crear nuevo cliente
                    await clientesAPI.crear(cliente);
                    utils.mostrarExito('Cliente creado exitosamente');
                }
                cerrarModalCliente();
                cargarClientes();
            } catch (error) {
                utils.mostrarError(error.message);
            }
        });

        function verCliente(id) {
            // Mostrar información del cliente en un modal o alert temporal
            clientesAPI.obtenerPorId(id).then(datos => {
                const cliente = datos.cliente;
                const mensaje = `
Cliente: ${cliente.nombre_razon_social}
RFC: ${cliente.rfc || 'N/A'}
Email: ${cliente.email || 'N/A'}
Teléfono: ${cliente.telefono || 'N/A'}
Dirección: ${cliente.direccion || 'N/A'}
Giro: ${cliente.giro || 'N/A'}
Contacto Principal: ${cliente.contacto_principal || 'N/A'}
Fecha de Alta: ${utils.formatearFecha(cliente.fecha_alta)}
                `.trim();
                alert(mensaje);
            }).catch(error => {
                utils.mostrarError('Error al cargar cliente: ' + error.message);
            });
        }

        let clienteEditandoId = null;

        async function editarCliente(id) {
            try {
                clienteEditandoId = id;
                const datos = await clientesAPI.obtenerPorId(id);
                const cliente = datos.cliente;
                
                // Llenar el formulario con los datos del cliente
                document.querySelector('#formNuevoCliente [name="nombre_razon_social"]').value = cliente.nombre_razon_social || '';
                document.querySelector('#formNuevoCliente [name="rfc"]').value = cliente.rfc || '';
                document.querySelector('#formNuevoCliente [name="email"]').value = cliente.email || '';
                document.querySelector('#formNuevoCliente [name="telefono"]').value = cliente.telefono || '';
                document.querySelector('#formNuevoCliente [name="direccion"]').value = cliente.direccion || '';
                document.querySelector('#formNuevoCliente [name="giro"]').value = cliente.giro || '';
                document.querySelector('#formNuevoCliente [name="contacto_principal"]').value = cliente.contacto_principal || '';
                
                // Cambiar el título del modal
                document.querySelector('#modalNuevoCliente h3').textContent = 'Editar Cliente';
                
                // Abrir el modal
                document.getElementById('modalNuevoCliente').classList.remove('hidden');
            } catch (error) {
                utils.mostrarError('Error al cargar datos del cliente: ' + error.message);
            }
        }

        cargarClientes();
    </script>
</body>
</html>
