<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cotizaciones - Login</title>
    <!-- Tailwind CSS CDN como fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet" onerror="this.onerror=null; this.href='https://cdn.tailwindcss.com'">
    <style>
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .input-field {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }
        .input-field:focus {
            outline: none;
            ring: 2px;
            ring-color: #3b82f6;
            border-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 p-8">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-primary-600 mb-2">CRM Cotizaciones</h1>
                <p class="text-gray-600">Inicia sesión en tu cuenta</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="input-field"
                        placeholder="tu@email.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="input-field"
                        placeholder="••••••••"
                    >
                </div>

                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded"></div>

                <button
                    type="submit"
                    class="w-full btn-primary"
                >
                    Iniciar Sesión
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                <p>Usuarios de prueba:</p>
                <p class="mt-2">
                    <strong>Admin:</strong> admin@test.com / password123<br>
                    <strong>Ventas:</strong> ventas@test.com / password123<br>
                    <strong>Lectura:</strong> lectura@test.com / password123
                </p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // Si ya está autenticado, redirigir
        if (localStorage.getItem('accessToken')) {
            window.location.href = '/index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                errorDiv.classList.add('hidden');
                const response = await authAPI.login(email, password);

                // Guardar tokens y usuario
                localStorage.setItem('accessToken', response.tokens.accessToken);
                localStorage.setItem('refreshToken', response.tokens.refreshToken);
                localStorage.setItem('usuario', JSON.stringify(response.usuario));

                // Redirigir al dashboard
                window.location.href = '/index.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Error al iniciar sesión';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
