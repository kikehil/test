<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Cotización</title>
    <!-- Tailwind CSS CDN como fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet" onerror="this.onerror=null;">
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto py-8 px-4">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <div id="loading" class="text-center py-8">
                <p class="text-gray-600">Cargando cotización...</p>
            </div>

            <div id="cotizacionContent" class="hidden">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">COTIZACIÓN</h1>
                    <p id="folio" class="text-lg text-gray-600"></p>
                </div>

                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div>
                        <h3 class="font-semibold text-gray-900 mb-2">Datos de la Empresa</h3>
                        <p id="empresaNombre" class="text-gray-700"></p>
                        <p id="empresaDireccion" class="text-gray-600 text-sm"></p>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-900 mb-2">Cliente</h3>
                        <p id="clienteNombre" class="text-gray-700"></p>
                        <p id="clienteDireccion" class="text-gray-600 text-sm"></p>
                    </div>
                </div>

                <div class="mb-8">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cantidad</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Unidad</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descripción</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">P. Unit.</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="partidasTable" class="bg-white divide-y divide-gray-200">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>

                <div class="text-right mb-8">
                    <p class="text-gray-700 mb-2">Subtotal: <span id="subtotal" class="font-semibold"></span></p>
                    <p class="text-gray-700 mb-2">IVA (16%): <span id="iva" class="font-semibold"></span></p>
                    <p class="text-2xl font-bold text-gray-900">Total: <span id="total"></span></p>
                </div>

                <div id="acciones" class="flex justify-center space-x-4">
                    <button onclick="generarPDF()" class="btn-secondary">Descargar PDF</button>
                    <button onclick="aceptarCotizacion()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">
                        Aceptar Cotización
                    </button>
                    <button onclick="mostrarRechazo()" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700">
                        Rechazar
                    </button>
                </div>

                <div id="formRechazo" class="hidden mt-6 p-4 bg-red-50 rounded-lg">
                    <h3 class="font-semibold text-red-900 mb-2">Motivo del rechazo</h3>
                    <textarea id="comentariosRechazo" class="w-full p-2 border border-red-300 rounded" rows="3" placeholder="Ingrese el motivo del rechazo..."></textarea>
                    <button onclick="rechazarCotizacion()" class="mt-2 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                        Confirmar Rechazo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = window.location.pathname.split('/').pop();
        
        async function cargarCotizacion() {
            try {
                const response = await fetch(`/cotizacion/${token}/public`);
                const data = await response.json();
                
                if (data.cotizacion) {
                    mostrarCotizacion(data.cotizacion);
                } else {
                    document.getElementById('loading').innerHTML = '<p class="text-red-600">Cotización no encontrada</p>';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '<p class="text-red-600">Error al cargar la cotización</p>';
            }
        }

        function mostrarCotizacion(cotizacion) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('cotizacionContent').classList.remove('hidden');

            document.getElementById('folio').textContent = `Folio: ${cotizacion.folio}`;
            document.getElementById('empresaNombre').textContent = cotizacion.empresa_nombre || 'Mi Empresa';
            document.getElementById('empresaDireccion').textContent = cotizacion.empresa_direccion || '';
            document.getElementById('clienteNombre').textContent = cotizacion.cliente_nombre;
            document.getElementById('clienteDireccion').textContent = cotizacion.cliente_direccion || '';

            const partidasTbody = document.getElementById('partidasTable');
            partidasTbody.innerHTML = cotizacion.partidas.map(p => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${p.cantidad}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${p.unidad}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${p.descripcion}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${parseFloat(p.precio_unitario).toFixed(2)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${parseFloat(p.subtotal).toFixed(2)}</td>
                </tr>
            `).join('');

            document.getElementById('subtotal').textContent = `$${parseFloat(cotizacion.subtotal).toFixed(2)}`;
            document.getElementById('iva').textContent = `$${parseFloat(cotizacion.iva).toFixed(2)}`;
            document.getElementById('total').textContent = `$${parseFloat(cotizacion.total).toFixed(2)}`;

            // Si ya está aceptada o rechazada, ocultar botones
            if (cotizacion.estado === 'Aceptada' || cotizacion.estado === 'Rechazada') {
                document.getElementById('acciones').innerHTML = `
                    <div class="text-center">
                        <p class="text-lg font-semibold ${cotizacion.estado === 'Aceptada' ? 'text-green-600' : 'text-red-600'}">
                            Esta cotización ha sido ${cotizacion.estado.toLowerCase()}
                        </p>
                        ${cotizacion.comentarios_cliente ? `<p class="mt-2 text-gray-600">${cotizacion.comentarios_cliente}</p>` : ''}
                    </div>
                `;
            }
        }

        async function generarPDF() {
            try {
                const response = await fetch(`/cotizacion/${token}/pdf`);
                if (!response.ok) throw new Error('Error al generar PDF');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `cotizacion_${token}.pdf`;
                link.click();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Error al generar PDF: ' + error.message);
            }
        }

        async function aceptarCotizacion() {
            if (!confirm('¿Está seguro de aceptar esta cotización?')) return;

            try {
                const response = await fetch(`/cotizacion/${token}/aceptar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comentarios: '' })
                });

                const data = await response.json();
                alert('Cotización aceptada exitosamente');
                location.reload();
            } catch (error) {
                alert('Error al aceptar la cotización');
            }
        }

        function mostrarRechazo() {
            document.getElementById('formRechazo').classList.remove('hidden');
        }

        async function rechazarCotizacion() {
            const comentarios = document.getElementById('comentariosRechazo').value;
            if (!comentarios.trim()) {
                alert('Por favor ingrese el motivo del rechazo');
                return;
            }

            try {
                const response = await fetch(`/cotizacion/${token}/rechazar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comentarios })
                });

                const data = await response.json();
                alert('Cotización rechazada exitosamente');
                location.reload();
            } catch (error) {
                alert('Error al rechazar la cotización');
            }
        }

        cargarCotizacion();
    </script>
</body>
</html>
