<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cotizaciones - Cotizaciones</title>
    <!-- Tailwind CSS CDN como fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/output.css" rel="stylesheet" onerror="this.onerror=null;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 via-blue-50 to-purple-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-xl border-b-2 border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-primary-600">CRM Cotizaciones</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/cotizaciones.html" class="border-primary-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Cotizaciones
                        </a>
                        <a href="/clientes.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Clientes
                        </a>
                        <a href="/productos.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Productos
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="usuarioNombre" class="text-sm text-gray-700 mr-4"></span>
                    <button onclick="authAPI.logout()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-blue-500 to-purple-500 rounded-lg p-3">
                    <i class="fas fa-file-invoice-dollar text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">Cotizaciones</h2>
            </div>
            <button onclick="abrirModalNuevaCotizacion()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-200 shadow-lg hover:shadow-xl font-semibold transform hover:-translate-y-0.5">
                <i class="fas fa-plus mr-2"></i>Nueva Cotización
            </button>
        </div>

        <!-- Filtros -->
        <div class="card bg-white mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                    <select id="filtroEstado" class="input-field" onchange="cargarCotizaciones()">
                        <option value="">Todos</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Enviada">Enviada</option>
                        <option value="Aceptada">Aceptada</option>
                        <option value="Rechazada">Rechazada</option>
                        <option value="Vencida">Vencida</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cliente</label>
                    <input type="text" id="filtroCliente" class="input-field" placeholder="Buscar cliente..." onkeyup="cargarCotizaciones()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar</label>
                    <input type="text" id="filtroBuscar" class="input-field" placeholder="Folio, cliente..." onkeyup="cargarCotizaciones()">
                </div>
            </div>
        </div>

        <!-- Tabla de cotizaciones -->
        <div class="card bg-white overflow-hidden p-0">
            <table class="min-w-full">
                <thead>
                    <tr>
                        <th class="table-header">Folio</th>
                        <th class="table-header">Fecha</th>
                        <th class="table-header">Cliente</th>
                        <th class="table-header">Estado</th>
                        <th class="table-header">Total</th>
                        <th class="table-header">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCotizaciones" class="bg-white divide-y divide-gray-200">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Nueva Cotización -->
    <div id="modalNuevaCotizacion" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-10 mx-auto p-5 border w-11/12 md:w-4/5 lg:w-3/4 shadow-lg rounded-md bg-white max-h-[90vh] overflow-y-auto">
            <div class="mt-3">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Nueva Cotización</h3>
                <form id="formNuevaCotizacion" class="space-y-4">
                    <!-- Datos generales -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cliente *</label>
                            <select id="selectCliente" name="cliente_id" required class="input-field">
                                <option value="">Seleccionar cliente...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha *</label>
                            <input type="date" name="fecha" required class="input-field" value="${new Date().toISOString().split('T')[0]}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Vencimiento</label>
                            <input type="date" name="fecha_vencimiento" class="input-field">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Contacto del Cliente</label>
                            <input type="text" name="contacto_cliente" class="input-field" placeholder="Nombre del contacto">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Condiciones de Pago</label>
                            <input type="text" name="condiciones_pago" class="input-field" placeholder="Ej: 30 días">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Validez</label>
                            <input type="text" name="validez" class="input-field" placeholder="Ej: 30 días">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Notas</label>
                        <textarea name="notas" class="input-field" rows="3" placeholder="Notas adicionales..."></textarea>
                    </div>

                    <!-- Partidas -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700">Partidas *</label>
                            <button type="button" onclick="agregarPartida()" class="text-sm btn-primary">+ Agregar Partida</button>
                        </div>
                        <div id="partidasContainer" class="space-y-2">
                            <!-- Las partidas se agregan aquí dinámicamente -->
                        </div>
                    </div>

                    <!-- Totales -->
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="flex justify-end space-x-4">
                            <div class="text-right">
                                <p class="text-sm text-gray-600">Subtotal:</p>
                                <p class="text-sm text-gray-600">IVA (16%):</p>
                                <p class="text-lg font-bold text-gray-900">Total:</p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-medium" id="subtotalPreview">$0.00</p>
                                <p class="text-sm font-medium" id="ivaPreview">$0.00</p>
                                <p class="text-lg font-bold text-primary-600" id="totalPreview">$0.00</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="cerrarModal()" class="btn-secondary">Cancelar</button>
                        <button type="submit" class="btn-primary">Crear Cotización</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // Verificar autenticación
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
        }

        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        document.getElementById('usuarioNombre').textContent = usuario.nombre || 'Usuario';

        async function cargarCotizaciones() {
            try {
                console.log('Iniciando carga de cotizaciones...');
                
                // Verificar autenticación
                const token = localStorage.getItem('accessToken');
                if (!token) {
                    console.error('No hay token de autenticación');
                    window.location.href = '/login.html';
                    return;
                }
                
                const estado = document.getElementById('filtroEstado')?.value || '';
                const params = {};
                if (estado && estado !== 'Todos') params.estado = estado;

                console.log('Obteniendo cotizaciones con params:', params);
                const datos = await cotizacionesAPI.obtenerTodas(params);
                console.log('Datos recibidos:', datos);
                
                const tbody = document.getElementById('tablaCotizaciones');
                
                if (!tbody) {
                    console.error('No se encontró el elemento tablaCotizaciones');
                    return;
                }

                if (!datos || !datos.cotizaciones) {
                    console.error('Estructura de datos incorrecta:', datos);
                    tbody.innerHTML = '<tr><td colspan="6" class="table-cell text-center text-red-500">Error: Estructura de datos incorrecta</td></tr>';
                    return;
                }

                if (datos.cotizaciones.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="table-cell text-center text-gray-500">No hay cotizaciones</td></tr>';
                    return;
                }

                tbody.innerHTML = datos.cotizaciones.map(c => `
                    <tr>
                        <td class="table-cell font-medium">${c.folio}</td>
                        <td class="table-cell">${utils.formatearFecha(c.fecha)}</td>
                        <td class="table-cell">${c.cliente_nombre}</td>
                        <td class="table-cell">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                                c.estado === 'Aceptada' ? 'bg-green-100 text-green-800' :
                                c.estado === 'Rechazada' ? 'bg-red-100 text-red-800' :
                                c.estado === 'Enviada' ? 'bg-blue-100 text-blue-800' :
                                'bg-yellow-100 text-yellow-800'
                            }">
                                ${c.estado}
                            </span>
                        </td>
                        <td class="table-cell">${utils.formatearMoneda(c.total)}</td>
                        <td class="table-cell">
                            <div class="flex space-x-2">
                                <button onclick="verCotizacion(${c.id})" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg hover:bg-blue-200 transition-colors font-medium">
                                    <i class="fas fa-eye mr-1"></i>Ver
                                </button>
                                <button onclick="cotizacionesAPI.generarPDF(${c.id})" class="bg-red-100 text-red-700 px-3 py-1 rounded-lg hover:bg-red-200 transition-colors font-medium">
                                    <i class="fas fa-file-pdf mr-1"></i>PDF
                                </button>
                                ${usuario.rol === 'ADMIN' || usuario.rol === 'VENTAS' ? `
                                    <button onclick="enviarCorreo(${c.id})" class="bg-green-100 text-green-700 px-3 py-1 rounded-lg hover:bg-green-200 transition-colors font-medium">
                                        <i class="fas fa-envelope mr-1"></i>Enviar
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error completo cargando cotizaciones:', error);
                console.error('Stack:', error.stack);
                console.error('Error details:', {
                    message: error.message,
                    name: error.name,
                    response: error.response
                });
                
                const tbody = document.getElementById('tablaCotizaciones');
                if (tbody) {
                    const errorMsg = error.message || 'Error desconocido al cargar cotizaciones';
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="table-cell text-center text-red-500 p-8">
                                <div class="flex flex-col items-center space-y-2">
                                    <i class="fas fa-exclamation-triangle text-4xl mb-2"></i>
                                    <p class="font-bold">Error al cargar cotizaciones</p>
                                    <p class="text-sm">${errorMsg}</p>
                                    <button onclick="cargarCotizaciones()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                                        <i class="fas fa-redo mr-2"></i>Reintentar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
                
                // No mostrar alert si ya mostramos el error en la tabla
                // Solo mostrar si es un error crítico
                if (error.message && error.message.includes('401') || error.message.includes('Unauthorized')) {
                    alert('Tu sesión ha expirado. Por favor, inicia sesión nuevamente.');
                    window.location.href = '/login.html';
                }
            }
        }

        async function enviarCorreo(id) {
            if (!confirm('¿Enviar cotización por correo?')) return;
            try {
                await cotizacionesAPI.enviarPorCorreo(id);
                utils.mostrarExito('Cotización enviada exitosamente');
                cargarCotizaciones();
            } catch (error) {
                utils.mostrarError(error.message);
            }
        }

        function verCotizacion(id) {
            window.location.href = `/cotizacion-detalle.html?id=${id}`;
        }

        let partidasContador = 0;
        let productosDisponibles = [];

        async function abrirModalNuevaCotizacion() {
            console.log('abrirModalNuevaCotizacion llamado');
            try {
                // Verificar usuario
                const usuarioActual = JSON.parse(localStorage.getItem('usuario') || '{}');
                console.log('Usuario actual:', usuarioActual);
                
                if (usuarioActual.rol === 'LECTURA') {
                    alert('No tienes permisos para crear cotizaciones');
                    return;
                }
                
                // Buscar el modal
                const modal = document.getElementById('modalNuevaCotizacion');
                console.log('Modal encontrado:', !!modal);
                
                if (!modal) {
                    console.error('No se encontró el modal modalNuevaCotizacion');
                    alert('Error: No se encontró el formulario de nueva cotización. Por favor, recarga la página.');
                    return;
                }
                
                // Mostrar el modal primero
                modal.classList.remove('hidden');
                console.log('Modal mostrado');
                
                // Cargar clientes y productos
                try {
                    await cargarClientesParaSelect();
                    console.log('Clientes cargados');
                } catch (error) {
                    console.error('Error cargando clientes:', error);
                }
                
                try {
                    await cargarProductos();
                    console.log('Productos cargados');
                } catch (error) {
                    console.error('Error cargando productos:', error);
                }
                
                // Limpiar formulario
                const form = document.getElementById('formNuevaCotizacion');
                if (form) {
                    form.reset();
                    // Establecer fecha por defecto
                    const fechaInput = form.querySelector('[name="fecha"]');
                    if (fechaInput) {
                        fechaInput.value = new Date().toISOString().split('T')[0];
                    }
                }
                
                // Limpiar partidas
                const partidasContainer = document.getElementById('partidasContainer');
                if (partidasContainer) {
                    partidasContainer.innerHTML = '';
                }
                
                partidasContador = 0;
                
                // Actualizar totales
                if (typeof actualizarTotales === 'function') {
                    actualizarTotales();
                }
                
                // Agregar primera partida
                if (typeof agregarPartida === 'function') {
                    agregarPartida();
                } else {
                    console.error('La función agregarPartida no está definida');
                }
                
                console.log('Modal abierto correctamente');
            } catch (error) {
                console.error('Error completo abriendo modal:', error);
                console.error('Stack:', error.stack);
                alert('Error al abrir el formulario: ' + error.message);
            }
        }
        
        // Asegurar que la función esté disponible globalmente
        window.abrirModalNuevaCotizacion = abrirModalNuevaCotizacion;

        async function cargarClientesParaSelect() {
            try {
                const datos = await clientesAPI.obtenerTodos({ limite: 100 });
                const select = document.getElementById('selectCliente');
                select.innerHTML = '<option value="">Seleccionar cliente...</option>';
                datos.clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente.id;
                    option.textContent = cliente.nombre_razon_social;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error cargando clientes:', error);
            }
        }

        async function cargarProductos() {
            try {
                const datos = await productosAPI.obtenerTodos({ activo: 'true', limite: 100 });
                productosDisponibles = datos.productos;
            } catch (error) {
                console.error('Error cargando productos:', error);
            }
        }

        function agregarPartida() {
            try {
                partidasContador++;
                const container = document.getElementById('partidasContainer');
                if (!container) {
                    console.error('No se encontró partidasContainer');
                    return;
                }
                const partidaDiv = document.createElement('div');
                partidaDiv.className = 'bg-gray-50 p-3 rounded-lg border';
                partidaDiv.id = `partida-${partidasContador}`;
                partidaDiv.innerHTML = `
                <div class="grid grid-cols-12 gap-2 items-end">
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-600 mb-1">Cantidad</label>
                        <input type="number" step="0.01" min="0" value="1" class="input-field partida-cantidad" onchange="calcularPartida(${partidasContador})" oninput="calcularPartida(${partidasContador})">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-600 mb-1">Unidad</label>
                        <input type="text" value="PZA" class="input-field partida-unidad" placeholder="PZA">
                    </div>
                    <div class="col-span-4">
                        <label class="block text-xs text-gray-600 mb-1">Descripción *</label>
                        <input type="text" class="input-field partida-descripcion" required placeholder="Descripción del producto/servicio" onchange="buscarProducto(${partidasContador})">
                        <div id="sugerencias-${partidasContador}" class="hidden absolute z-10 bg-white border rounded shadow-lg mt-1 max-h-40 overflow-y-auto"></div>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs text-gray-600 mb-1">P. Unitario</label>
                        <input type="number" step="0.01" min="0" value="0" class="input-field partida-precio" onchange="calcularPartida(${partidasContador})" oninput="calcularPartida(${partidasContador})">
                    </div>
                    <div class="col-span-1">
                        <label class="block text-xs text-gray-600 mb-1">Subtotal</label>
                        <input type="text" class="input-field partida-subtotal" readonly value="$0.00">
                    </div>
                    <div class="col-span-1">
                        <button type="button" onclick="eliminarPartida(${partidasContador})" class="text-red-600 hover:text-red-800">✕</button>
                    </div>
                </div>
            `;
            container.appendChild(partidaDiv);
            calcularPartida(partidasContador);
        }

        function eliminarPartida(id) {
            document.getElementById(`partida-${id}`).remove();
            actualizarTotales();
        }

        function calcularPartida(id) {
            const partidaDiv = document.getElementById(`partida-${id}`);
            const cantidad = parseFloat(partidaDiv.querySelector('.partida-cantidad').value) || 0;
            const precio = parseFloat(partidaDiv.querySelector('.partida-precio').value) || 0;
            const subtotal = cantidad * precio;
            partidaDiv.querySelector('.partida-subtotal').value = utils.formatearMoneda(subtotal);
            actualizarTotales();
        }

        function buscarProducto(id) {
            const partidaDiv = document.getElementById(`partida-${id}`);
            const descripcion = partidaDiv.querySelector('.partida-descripcion').value.toLowerCase();
            const sugerenciasDiv = document.getElementById(`sugerencias-${id}`);
            
            if (descripcion.length < 2) {
                sugerenciasDiv.classList.add('hidden');
                return;
            }

            const matches = productosDisponibles.filter(p => 
                p.nombre.toLowerCase().includes(descripcion) || 
                (p.descripcion && p.descripcion.toLowerCase().includes(descripcion))
            ).slice(0, 5);

            if (matches.length === 0) {
                sugerenciasDiv.classList.add('hidden');
                return;
            }

            sugerenciasDiv.innerHTML = matches.map(p => `
                <div class="p-2 hover:bg-gray-100 cursor-pointer" onclick="seleccionarProducto(${id}, ${p.id})">
                    <div class="font-medium">${p.nombre}</div>
                    <div class="text-xs text-gray-500">${utils.formatearMoneda(p.precio_unitario)} ${p.unidad}</div>
                </div>
            `).join('');
            sugerenciasDiv.classList.remove('hidden');
        }

        function seleccionarProducto(partidaId, productoId) {
            try {
                const producto = productosDisponibles.find(p => p.id === productoId);
                if (!producto) {
                    console.error('Producto no encontrado:', productoId);
                    return;
                }

                const partidaDiv = document.getElementById(`partida-${partidaId}`);
                if (!partidaDiv) {
                    console.error('Partida no encontrada:', partidaId);
                    return;
                }

                const descripcionInput = partidaDiv.querySelector('.partida-descripcion');
                const precioInput = partidaDiv.querySelector('.partida-precio');
                const unidadInput = partidaDiv.querySelector('.partida-unidad');
                const sugerenciasDiv = document.getElementById(`sugerencias-${partidaId}`);

                if (descripcionInput) descripcionInput.value = producto.nombre || '';
                if (precioInput) precioInput.value = producto.precio_unitario || 0;
                if (unidadInput) unidadInput.value = producto.unidad || 'PZA';
                if (sugerenciasDiv) sugerenciasDiv.classList.add('hidden');
                
                if (typeof calcularPartida === 'function') {
                    calcularPartida(partidaId);
                }
            } catch (error) {
                console.error('Error seleccionando producto:', error);
            }
        }

        function actualizarTotales() {
            let subtotal = 0;
            document.querySelectorAll('.partida-subtotal').forEach(input => {
                const valor = input.value.replace('$', '').replace(',', '');
                subtotal += parseFloat(valor) || 0;
            });
            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            document.getElementById('subtotalPreview').textContent = utils.formatearMoneda(subtotal);
            document.getElementById('ivaPreview').textContent = utils.formatearMoneda(iva);
            document.getElementById('totalPreview').textContent = utils.formatearMoneda(total);
        }

        document.getElementById('formNuevaCotizacion').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validar que haya al menos una partida
            if (partidasContador === 0 || document.querySelectorAll('.partida-descripcion').length === 0) {
                utils.mostrarError('Debes agregar al menos una partida');
                return;
            }

            // Recopilar datos del formulario
            const formData = new FormData(e.target);
            const cotizacion = {
                fecha: formData.get('fecha'),
                fecha_vencimiento: formData.get('fecha_vencimiento') || null,
                cliente_id: parseInt(formData.get('cliente_id')),
                contacto_cliente: formData.get('contacto_cliente') || null,
                condiciones_pago: formData.get('condiciones_pago') || null,
                validez: formData.get('validez') || null,
                notas: formData.get('notas') || null,
                partidas: []
            };

            // Recopilar partidas
            document.querySelectorAll('[id^="partida-"]').forEach(partidaDiv => {
                const cantidad = parseFloat(partidaDiv.querySelector('.partida-cantidad').value) || 0;
                const unidad = partidaDiv.querySelector('.partida-unidad').value || 'PZA';
                const descripcion = partidaDiv.querySelector('.partida-descripcion').value;
                const precioUnitario = parseFloat(partidaDiv.querySelector('.partida-precio').value) || 0;

                if (descripcion && cantidad > 0 && precioUnitario > 0) {
                    cotizacion.partidas.push({
                        cantidad,
                        unidad,
                        descripcion,
                        precio_unitario: precioUnitario
                    });
                }
            });

            if (cotizacion.partidas.length === 0) {
                utils.mostrarError('Debes agregar al menos una partida válida');
                return;
            }

            try {
                const resultado = await cotizacionesAPI.crear(cotizacion);
                utils.mostrarExito('Cotización creada exitosamente');
                cerrarModal();
                cargarCotizaciones();
            } catch (error) {
                utils.mostrarError(error.message || 'Error al crear cotización');
            }
        });

        function cerrarModal() {
            const modal = document.getElementById('modalNuevaCotizacion');
            if (modal) {
                modal.classList.add('hidden');
            }
        }
        
        // Asegurar que todas las funciones estén disponibles globalmente
        window.cerrarModal = cerrarModal;
        window.agregarPartida = agregarPartida;
        window.eliminarPartida = eliminarPartida;
        window.calcularPartida = calcularPartida;
        window.buscarProducto = buscarProducto;
        window.seleccionarProducto = seleccionarProducto;
        window.verCotizacion = verCotizacion;
        window.enviarCorreo = enviarCorreo;
        window.abrirModalNuevaCotizacion = abrirModalNuevaCotizacion;

        // Cargar cotizaciones al iniciar
        console.log('Estado del documento:', document.readyState);
        console.log('Token disponible:', !!localStorage.getItem('accessToken'));
        console.log('Usuario:', usuario);
        
        // Esperar a que todo esté listo
        window.addEventListener('load', () => {
            console.log('Página completamente cargada, iniciando carga de cotizaciones');
            setTimeout(() => {
                cargarCotizaciones();
            }, 200);
        });
        
        // También intentar cargar si el DOM ya está listo
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(() => {
                cargarCotizaciones();
            }, 200);
        }
    </script>
</body>
</html>
